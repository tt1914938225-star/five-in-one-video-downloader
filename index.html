<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1020"><title>五合一视频下载器 V2 Beta</title>
<style>
:root{--bg:#070b16;--card:#10182b;--muted:#91a0bd;--text:#eef4ff;--line:#22304f}
*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:system-ui,-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:radial-gradient(circle at 20% 0%,#1a2850 0,transparent 34%),radial-gradient(circle at 100% 20%,#24153d 0,transparent 28%),var(--bg);color:var(--text)}
.wrap{width:min(980px,calc(100% - 28px));margin:auto;padding:52px 0 70px}.hero{text-align:center}.hero h1{font-size:clamp(30px,6vw,50px);margin:0 0 10px}.hero p{color:var(--muted);margin:0}
.platforms{display:flex;flex-wrap:wrap;gap:9px;justify-content:center;margin:22px 0 27px}.pill{border:1px solid var(--line);background:#0d1528;padding:8px 12px;border-radius:999px;font-size:13px}
.card{background:rgba(16,24,43,.9);border:1px solid var(--line);border-radius:22px;padding:21px}.row{display:grid;grid-template-columns:auto 1fr auto;gap:11px}
input{width:100%;border:1px solid var(--line);background:#090f1e;color:#fff;border-radius:14px;padding:16px;font-size:16px;outline:none}
button{border:0;border-radius:14px;padding:0 20px;font-weight:750;font-size:15px;cursor:pointer}.paste{background:#17233d;color:#dce7ff;border:1px solid #2b3b61}.go{background:linear-gradient(135deg,#7893ff,#5d68f2);color:#fff;min-height:54px}
button:disabled{opacity:.55}.tip{margin-top:12px;color:var(--muted);font-size:13px}.status{display:none;margin-top:15px;padding:13px 15px;border-radius:12px;background:#0a1121;font-size:14px}.status.bad{color:#ffd6da;border:1px solid #66313a}
.result{display:none;margin-top:18px;border-top:1px solid var(--line);padding-top:18px}.head{display:grid;grid-template-columns:160px 1fr;gap:17px;margin-bottom:18px}.cover{width:100%;aspect-ratio:4/5;object-fit:cover;background:#080e1b;border-radius:14px;border:1px solid var(--line)}
.title{font-size:20px;font-weight:800;line-height:1.45;margin:3px 0 8px}.sub{color:var(--muted);font-size:13px}.section{margin-top:18px}.section h3{font-size:16px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}
.media{border:1px solid var(--line);background:#0b1325;border-radius:14px;padding:12px;min-width:0}.media video,.media img{width:100%;max-height:300px;object-fit:contain;background:#050914;border-radius:10px;margin-bottom:10px}
.mrow{display:flex;align-items:center;gap:10px}.mtext{flex:1;min-width:0}.mname{font-weight:800;font-size:14px}.quality{font-size:12px;color:var(--muted);margin-top:3px}.actions a,.actions button{background:#edf2ff;color:#10182b;text-decoration:none;font-size:13px;font-weight:800;padding:9px 11px;border-radius:9px;white-space:nowrap}.actions button{border:0;cursor:pointer}.media .error{color:#ffd6da;font-size:13px;line-height:1.5}.actions{display:flex;gap:8px;flex-wrap:wrap}
.head.no-cover{grid-template-columns:1fr}.title{overflow-wrap:anywhere}
details{margin-top:18px;color:var(--muted);font-size:12px}pre{white-space:pre-wrap;word-break:break-all;max-height:260px;overflow:auto;background:#080e1b;padding:10px;border-radius:10px}
footer{text-align:center;color:#71809f;font-size:12px;margin-top:20px}
@media(max-width:680px){.wrap{padding-top:33px}.card{padding:15px}.row{grid-template-columns:1fr 1fr}.row input{grid-column:1/-1;grid-row:1}.head{grid-template-columns:1fr}.grid{grid-template-columns:1fr}.cover{aspect-ratio:16/10}}
</style>
</head>
<body>
<main class="wrap">
<section class="hero"><h1>五合一视频下载器</h1><p>视频优先可用高画质 · 图文逐项校验 · 多段视频完整列出</p>
<div class="platforms"><span class="pill">Instagram</span><span class="pill">X / Twitter</span><span class="pill">TikTok</span><span class="pill">抖音</span><span class="pill">小红书</span></div></section>
<section class="card">
<div class="row"><button id="paste" class="paste">一键粘贴</button><input aria-label="分享链接" id="url" placeholder="粘贴链接或完整分享文案"><button id="go" class="go">开始解析</button></div>
<div class="tip">仅用于你有权保存的公开内容。抖音优先由本站后端直接解析，第三方接口仅作备用。本站单文件转发上限为 18 MiB。</div><div id="status" class="status" role="status" aria-live="polite"></div>
<div id="result" class="result">
<div class="head"><img id="cover" class="cover" alt="作品预览"><div><div id="title" class="title"></div><div id="sub" class="sub"></div></div></div>
<div id="ls" class="section" style="display:none"><h3>实况照片</h3><div id="lives" class="grid"></div></div>
<div id="vs" class="section"><h3>视频</h3><div id="videos" class="grid"></div></div>
<div id="is" class="section"><h3>图片</h3><div id="images" class="grid"></div></div>
<div id="as" class="section"><h3>音频</h3><div id="audios" class="grid"></div></div>
<details><summary>解析详情（已隐藏下载凭证与源站签名）</summary><pre id="debug"></pre></details>
</div>
</section><footer>V2 Beta · 媒体校验后提供下载 · 临时链接失效请重新解析</footer>
</main>
<script type="module" src="/app.js"></script>
</body></html>
